[package]
name = "reel-core"
version = "1.3.0"
edition = "2021"
rust-version = "1.80" # any Rust from mid-2024 on builds it
description = "ProtoArt Reel's native core: the heavy work, moved out of JavaScript one piece at a time"
license = "Apache-2.0"
publish = false

# No dependencies on purpose: nothing to download, nothing third-party to audit.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
